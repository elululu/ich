<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ICH !!! — Push Pull Legs</title>
  <meta name="description" content="Programme de musculation avancé Push / Pull / Legs avec séries, chrono de repos et un coach qui crie ICH !!!">
  <meta name="theme-color" content="#FFD60A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ICH">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/bangers.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <a id="resume" class="resume hidden" href="#/workout"><span>▶ SÉANCE EN COURS</span><span id="resumeTitle"></span></a>

  <nav class="tabs" aria-label="Navigation">
    <a href="#/" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
      AUJOURD'HUI
    </a>
    <a href="#/week" data-tab="week">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      SEMAINE
    </a>
    <a href="#/food" data-tab="food">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2v6a3 3 0 0 0 6 0V2M8 2v20M17 22V2c2.5 1.6 4 4.6 4 8.5 0 1.8-1.3 3-4 3"/></svg>
      BOUFFE
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M6 16V9M11 16V5M16 16v-5M21 16v-8"/></svg>
      PROGRÈS
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M3 9l6-6M15 21l6-6M2 12l3 3M12 2l3 3M9 22l3-3M19 12l3-3"/></svg>
      RÉGLAGES
    </a>
  </nav>

  <!-- Chrono de repos plein écran -->
  <section id="rest" class="rest hidden" aria-label="Repos">
    <div class="rest-top">
      <span class="bang">REPOS</span>
      <button class="btn sm" id="restMin">Réduire ▾</button>
    </div>
    <img class="rest-mascot" src="img/mascot_rest.png" alt="">
    <div class="ring">
      <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="restArc" cx="60" cy="60" r="52"/></svg>
      <div class="rest-time" id="restTime">0:00</div>
    </div>
    <p class="rest-line" id="restLine"></p>
    <p class="rest-next" id="restNext"></p>
    <div class="rest-btns">
      <button class="btn" data-adj="-15">−15 s</button>
      <button class="btn skip" id="restSkip">GO ! ICH !</button>
      <button class="btn" data-adj="15">+15 s</button>
    </div>
  </section>
  <button id="restMini" class="rest-mini hidden">⏱ 0:00</button>

  <div id="burst" class="burst hidden"><div class="burst-wrap"><div class="burst-shape"><span id="burstText">ICH !!!</span></div></div></div>

  <div id="sheet" class="sheet-wrap hidden"><div class="sheet" role="dialog" aria-modal="true"></div></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
